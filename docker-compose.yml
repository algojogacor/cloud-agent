services:
  cloud-agent:
    build: .
    container_name: cloud-agent
    ports:
      - "3000:3000"
    environment:
      # DeepSeek Keys (5 for rotation)
      - DEEPSEEK_API_KEY_1=${DEEPSEEK_API_KEY_1}
      - DEEPSEEK_API_KEY_2=${DEEPSEEK_API_KEY_2}
      - DEEPSEEK_API_KEY_3=${DEEPSEEK_API_KEY_3}
      - DEEPSEEK_API_KEY_4=${DEEPSEEK_API_KEY_4}
      - DEEPSEEK_API_KEY_5=${DEEPSEEK_API_KEY_5}
      
      # Perplexity (native search — no MCP needed)
      - PERPLEXITY_API_KEY_1=${PERPLEXITY_API_KEY_1}
      - PERPLEXITY_API_KEY_2=${PERPLEXITY_API_KEY_2}

      # Supabase auth persistence
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_STORAGE_BUCKET=${SUPABASE_STORAGE_BUCKET:-nanobot-private}
      - SUPABASE_AUTH_OBJECT=${SUPABASE_AUTH_OBJECT:-whatsapp-auth/auth.zip}
      - SUPABASE_SYNC_INTERVAL_SECONDS=${SUPABASE_SYNC_INTERVAL_SECONDS:-300}
      
      # Fallback providers
      - GROQ_API_KEY=${GROQ_API_KEY}
      - QWEN_API_KEY=${QWEN_API_KEY}
      
      # Config
      - NANOBOT_PORT=3000
      - MCP_BRAVE_PORT=9101
      - MCP_GOOGLE_PORT=9102
      - LOG_LEVEL=info
    volumes:
      - ./data:/app/data  # Persist SQLite memory
    restart: unless-stopped
