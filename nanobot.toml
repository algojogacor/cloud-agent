# ============================================
# Nanobot Configuration - Cloud Agent
# Multi-provider with DeepSeek Key Rotation
# ============================================

[model.deepseek-1]
provider = "openai"  # DeepSeek uses OpenAI-compatible API
model = "deepseek-chat"
api_key = "${DEEPSEEK_API_KEY_1}"
base_url = "https://api.deepseek.com/v1"
prio = 1

[model.deepseek-2]
provider = "openai"
model = "deepseek-chat"
api_key = "${DEEPSEEK_API_KEY_2}"
base_url = "https://api.deepseek.com/v1"
prio = 2

[model.deepseek-3]
provider = "openai"
model = "deepseek-chat"
api_key = "${DEEPSEEK_API_KEY_3}"
base_url = "https://api.deepseek.com/v1"
prio = 3

[model.deepseek-4]
provider = "openai"
model = "deepseek-chat"
api_key = "${DEEPSEEK_API_KEY_4}"
base_url = "https://api.deepseek.com/v1"
prio = 4

[model.deepseek-5]
provider = "openai"
model = "deepseek-chat"
api_key = "${DEEPSEEK_API_KEY_5}"
base_url = "https://api.deepseek.com/v1"
prio = 5

[model.groq]
provider = "openai"
model = "llama-3.1-8b-instant"
api_key = "${GROQ_API_KEY}"
base_url = "https://api.groq.com/openai/v1"
prio = 10

[model.qwen]
provider = "openai"
model = "qwen-turbo"
api_key = "${QWEN_API_KEY}"
base_url = "https://dashscope-intl.aliyuncs.com/compatible-mode/v1"
prio = 11

# Perplexity — built-in web search, no MCP needed
[model.perplexity-1]
provider = "openai"
model = "sonar"
api_key = "${PERPLEXITY_API_KEY_1}"
base_url = "https://api.perplexity.ai"
prio = 6

[model.perplexity-2]
provider = "openai"
model = "sonar-pro"
api_key = "${PERPLEXITY_API_KEY_2}"
base_url = "https://api.perplexity.ai"
prio = 7

# Default routing:
# - Search tasks: Perplexity first (native search) → DeepSeek → Groq
# - General tasks: DeepSeek rotation → Perplexity → Groq → Qwen
[model.default]
tool_model = ["perplexity-1", "perplexity-2", "deepseek-1", "deepseek-2", "deepseek-3", "deepseek-4", "deepseek-5", "groq", "qwen"]
doc_model = ["deepseek-1", "deepseek-2", "deepseek-3", "deepseek-4", "deepseek-5", "perplexity-1", "groq"]
check_model = ["groq", "qwen"]

# ============================================
# Memory Configuration
# ============================================

[memory]
type = "sqlite"
path = "/app/data/memory.db"

# ============================================
# Chat Apps
# ============================================

[app.telegram]
token = "${TELEGRAM_BOT_TOKEN}"
enable_mention = true

