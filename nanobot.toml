# ============================================
# Nanobot Configuration - Cloud Agent
# ============================================

[agents.defaults]
model = "deepseek-chat"
provider = "deepseek"
workspace = "/app/data"

[providers.deepseek]
api_key = "${DEEPSEEK_API_KEY_1}"
# base_url = "https://api.deepseek.com/v1" # Optional, Nanobot uses default if omitted

[providers.perplexity]
api_key = "${PERPLEXITY_API_KEY_1}"

[providers.groq]
api_key = "${GROQ_API_KEY}"

[providers.qwen]
api_key = "${QWEN_API_KEY}"

[channels.telegram]
token = "${TELEGRAM_BOT_TOKEN}"
enable_mention = true

[gateway]
host = "0.0.0.0"
port = 18790
